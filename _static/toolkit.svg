<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
<title id="title">Ways to use WWF ITR Tool</title><desc id="desc">The online and local app use the wwf-itr engine, as do scoring notebooks and Python workflows. Standalone portfolio coverage uses pandas and CTA data.</desc>
